<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pynx Inventory Dashboard</title>
  <link rel="icon" href="assets/img/dash_logo.png">

  <!-- Styles: each file has one job -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="app">
    <aside class="sb">
      <img class="logo" src="assets/img/dash_logo.png" alt="Pynx — Beyond the Trend">
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="who" id="who"></div>
    </aside>
    <main id="main"></main>
  </div>

  <!-- Scripts: plain files (no build step) — order matters: config → core → data → services → components → views → app -->
  <script src="js/config.js"></script>

  <script src="js/core/util.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/data/storage.js"></script>
  <script src="js/core/store.js"></script>

  <script src="js/services/products.js"></script>
  <script src="js/services/stock.js"></script>
  <script src="js/services/requisitions.js"></script>
  <script src="js/services/analytics.js"></script>

  <script src="js/core/ui.js"></script>
  <script src="js/core/router.js"></script>

  <script src="js/components/status-pill.js"></script>
  <script src="js/components/product-picker.js"></script>
  <script src="js/components/receipt.js"></script>

  <script src="js/views/dashboard.js"></script>
  <script src="js/views/products.js"></script>
  <script src="js/views/stockin.js"></script>
  <script src="js/views/stockout.js"></script>
  <script src="js/views/releases.js"></script>
  <script src="js/views/reports.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
